name: LLM Evaluation and Regression Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  eval-and-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t llm-eval-harness:latest .

    - name: Initialize Database
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace -e DATABASE_PATH=/workspace/eval.db llm-eval-harness:latest init-db

    - name: Run Baseline Evaluations
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace -e DATABASE_PATH=/workspace/eval.db llm-eval-harness:latest run-eval --test-set tests/test_set_example.json --run-id baseline_run --is-baseline

    - name: Run PR Evaluations
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace -e DATABASE_PATH=/workspace/eval.db llm-eval-harness:latest run-eval --test-set tests/test_set_example.json --run-id pr_run

    - name: Compare for Regressions
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace -e DATABASE_PATH=/workspace/eval.db llm-eval-harness:latest compare-regression --run-id pr_run --baseline-id baseline_run
