[tool.poetry]
name = "llm-eval-harness"
version = "0.1.0"
description = "Production-shaped LLM Eval & Observability Harness"
authors = ["Antigravity <antigravity@google.com>"]
packages = [{include = "eval_harness"}]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
click = "^8.1.0"
tenacity = "^8.2.0"
httpx = "^0.24.0"
python-dotenv = "^1.0.0"
streamlit = "^1.22.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
